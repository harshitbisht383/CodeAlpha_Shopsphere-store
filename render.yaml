services:
  - type: web
    name: shopsphere-store
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SHOPSPHERE_SECRET_KEY
        generateValue: true
      - key: SHOPSPHERE_HTTPS
        value: "true"
      - key: SHOPSPHERE_DATABASE
        value: /tmp/shopsphere.db
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
